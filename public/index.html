<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grilling Session</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)); }
    main { width: min(100%, 42rem); margin: 0 auto; }
    .eyebrow { color: #a5b4fc; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; }
    h1 { font-size: clamp(1.8rem, 7vw, 3rem); margin: .3rem 0 1.5rem; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 1.25rem; padding: 1.25rem; box-shadow: 0 1rem 3rem #0005; }
    .progress { height: .45rem; background: #374151; border-radius: 1rem; overflow: hidden; margin-bottom: 1.5rem; }
    .progress span { display: block; height: 100%; background: #818cf8; transition: width .2s; }
    h2 { margin: 0 0 .75rem; line-height: 1.15; }
    .body { white-space: pre-wrap; color: #e5e7eb; line-height: 1.55; }
    .recommendation { background: #312e81; border-left: .3rem solid #a5b4fc; padding: .9rem; border-radius: .5rem; line-height: 1.45; }
    label { display: block; margin: 1.25rem 0 .5rem; font-weight: 700; }
    textarea { width: 100%; min-height: 10rem; resize: vertical; padding: 1rem; border: 2px solid #4b5563; border-radius: .8rem; background: #111827; color: white; font: inherit; font-size: 1.05rem; }
    textarea:focus { outline: 3px solid #818cf866; border-color: #a5b4fc; }
    .actions { display: flex; gap: .75rem; margin-top: 1rem; }
    button { min-height: 3.2rem; flex: 1; border: 0; border-radius: .8rem; padding: .8rem 1rem; font: inherit; font-weight: 800; color: white; background: #4f46e5; }
    button.secondary { background: #374151; }
    button:disabled { opacity: .4; }
    .review-item { border-top: 1px solid #4b5563; padding: 1rem 0; }
    .review-item strong, .review-item span { display: block; }
    .review-item span { color: #d1d5db; margin-top: .35rem; white-space: pre-wrap; }
    .waiting { text-align: center; padding: 3rem 1rem; }
    .pulse { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; background: #818cf8; animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
    details { margin-top: 1rem; color: #d1d5db; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Phone companion</div>
  <h1>Grilling Session</h1>
  <section id="waiting" class="card waiting">
    <span class="pulse"></span>
    <h2>Waiting for the next round</h2>
    <p>You can leave this page open. It will update automatically.</p>
  </section>
  <section id="wizard" class="card" hidden>
    <div class="progress"><span id="progress"></span></div>
    <div id="question-view">
      <div id="counter" class="eyebrow"></div>
      <h2 id="title"></h2>
      <div id="body" class="body"></div>
      <p id="recommendation" class="recommendation"></p>
      <label for="answer">Your answer</label>
      <textarea id="answer" autocomplete="off"></textarea>
      <div class="actions"><button id="back" class="secondary">Back</button><button id="next">Next</button></div>
    </div>
    <div id="review-view" hidden>
      <div class="eyebrow">Review answers</div><h2>Ready to submit?</h2><div id="review"></div>
      <div class="actions"><button id="edit" class="secondary">Back</button><button id="submit">Submit answers</button></div>
    </div>
  </section>
  <details><summary>Previous rounds</summary><div id="history"></div></details>
</main>
<script>
  let current = null, index = 0, answers = [];
  const byId = id => document.getElementById(id);
  function showQuestion() {
    const question = current.questions[index];
    byId('question-view').hidden = false; byId('review-view').hidden = true;
    byId('counter').textContent = `Question ${index + 1} of ${current.questions.length}`;
    byId('title').textContent = question.title; byId('body').textContent = question.body;
    byId('recommendation').textContent = `Recommendation: ${question.recommendation}`;
    byId('answer').value = answers[index] || ''; byId('back').disabled = index === 0;
    byId('next').textContent = index === current.questions.length - 1 ? 'Review answers' : 'Next';
    byId('progress').style.width = `${((index + 1) / current.questions.length) * 100}%`;
    byId('answer').focus();
  }
  function saveAnswer() { answers[index] = byId('answer').value.trim(); }
  function showReview() {
    const review = byId('review'); review.replaceChildren();
    current.questions.forEach((question, position) => {
      const item = document.createElement('div'); item.className = 'review-item';
      const title = document.createElement('strong'); title.textContent = `${position + 1}. ${question.title}`;
      const answer = document.createElement('span'); answer.textContent = answers[position];
      item.append(title, answer); review.append(item);
    });
    byId('question-view').hidden = true; byId('review-view').hidden = false;
  }
  byId('back').onclick = () => { saveAnswer(); index -= 1; showQuestion(); };
  byId('next').onclick = () => {
    saveAnswer(); if (!answers[index]) { byId('answer').focus(); return; }
    if (index < current.questions.length - 1) { index += 1; showQuestion(); } else showReview();
  };
  byId('edit').onclick = () => { index = current.questions.length - 1; showQuestion(); };
  byId('submit').onclick = async () => {
    byId('submit').disabled = true;
    const response = await fetch(`/api/rounds/${current.id}/answers`, {
      method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({ answers }),
    });
    if (!response.ok) { byId('submit').disabled = false; return; }
    current = null; byId('wizard').hidden = true; byId('waiting').hidden = false; await loadHistory();
  };
  async function loadHistory() {
    const response = await fetch('/api/rounds'); if (!response.ok) return;
    const { rounds } = await response.json(); const history = byId('history'); history.replaceChildren();
    rounds.filter(round => round.status === 'answered').reverse().forEach(round => {
      const item = document.createElement('p');
      item.textContent = round.questions.map((question, i) => `${question.title}: ${round.answers[i]}`).join(' · ');
      history.append(item);
    });
  }
  async function pollForRound() {
    try {
      const response = await fetch('/api/rounds/current');
      if (response.ok) {
        const incoming = await response.json();
        if (!current || current.id !== incoming.id) {
          current = incoming; index = 0; answers = Array(current.questions.length).fill('');
          byId('waiting').hidden = true; byId('wizard').hidden = false; showQuestion();
        }
      }
    } finally { setTimeout(pollForRound, 2000); }
  }
  loadHistory(); pollForRound();
</script>
</body>
</html>
